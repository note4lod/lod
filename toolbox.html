<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07181d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Mariner Academy Toolbox</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="toolbox.css" />
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Simülatöre dön">‹</a>
    <div class="brand"><div class="radar"><i></i></div><div><small>DENİZCİLİK EĞİTİM SETİ</small><h1>Mariner Academy</h1></div></div>
    <button id="printButton" class="ghost">PDF / Yazdır</button>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">PROFESYONEL DENİZCİ TOOLBOX</p>
      <h2>Seyir ve manevra hesaplayıcıları</h2>
      <p>Hesaplamalar eğitim ve hızlı kontrol amaçlıdır. Geminin onaylı tabloları, SMS prosedürleri, kaptan talimatları ve resmi seyir yayınları daima önceliklidir.</p>
    </section>

    <nav id="toolNav" class="tool-nav" aria-label="Hesaplayıcılar"></nav>
    <section id="calculator" class="calculator"></section>
  </main>

  <template id="fieldTemplate"><label class="field"><span></span><input inputmode="decimal" /></label></template>
  <script src="toolbox.js"></script>
</body>
</html>

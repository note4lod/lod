name: Validate and package simulator v1.7

on:
  push:
    branches: [ecdis-v1.7-master]
    paths-ignore:
      - "release/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: node --check app-v17.js && node --check config.js && node --check sw.js
      - name: Required gameplay checks
        run: |
          grep -q 'function drawShip' app-v17.js
          grep -q 'function drawPrediction' app-v17.js
          grep -q 'Math.floor(minY / step)' app-v17.js
          grep -q 'styles-v17.css' index.html
          grep -q 'app-v17.js' index.html
          grep -q 'shipLengthInput' index.html
      - name: Package deployable ZIP
        run: |
          mkdir -p release
          rm -f release/E-P-Maneuver-Simulator-v1.7-MASTER.zip
          zip -9 release/E-P-Maneuver-Simulator-v1.7-MASTER.zip index.html styles.css styles-v17.css app-v17.js config.js sw.js manifest.webmanifest icon.svg netlify.toml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: E-P-Maneuver-Simulator-v1.7-MASTER
          path: release/E-P-Maneuver-Simulator-v1.7-MASTER.zip
          if-no-files-found: error
      - name: Publish ZIP to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          git diff --cached --quiet || git commit -m "Build E&P Maneuver Simulator v1.7 MASTER [skip ci]"
          git push
